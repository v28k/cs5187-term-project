# Settings appended to postgresql.conf for fuzzing (container and local builds).
# Durability is switched off for speed; the data are throwaway.
listen_addresses = '*'
max_connections = 40
shared_buffers = 256MB
fsync = off
synchronous_commit = off
full_page_writes = off
restart_after_crash = on
max_prepared_transactions = 10
max_worker_processes = 16
max_parallel_workers = 8

# Logging: the oracle reads TRAP:, PANIC: and "terminated by signal" from this log.
log_line_prefix = '%m [%p] '
log_min_messages = warning
log_min_error_statement = panic
log_error_verbosity = default
log_checkpoints = off
# If the server knows "backtrace_on_internal_error", the start scripts also turn it
# on, so every internal error (XX000) logs a C backtrace (used for deduplication).

# Keep autovacuum from changing plans in the middle of a run.
autovacuum = off

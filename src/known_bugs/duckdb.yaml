    affected: "2.1.0.dev2610310630"
    fixed_in: "open upstream"
    match:
      outcome: internal_error
      message_regex: "BoundReferenceExpression should not be used here yet"
  - id: duckdb-27983
    title: "window function reading a lambda parameter: Unrecognized expression type in logical operator visitor"
    source: "https://github.com/duckdb/duckdb/issues/27983 (open; reported by others, 28 Oct 2026)"
    affected: "2.1.0.dev2610310630"
    fixed_in: "open upstream"
    match:
      outcome: internal_error
      message_regex: "Unrecognized expression type in logical operator visitor"

# Known DuckDB bugs found by this fuzzer (format: pgfuzz/eval/known_bugs.py).
# Filing packages: docs/bughunt/duckdb/<ID>-<slug>/ (filed upstream by the team).
bugs:
  - id: duckdb-D01
    title: "min/max over a LIST/STRUCT/ARRAY (or collated VARCHAR) argument containing a subquery: Cannot copy BoundSubqueryExpression"
    source: "docs/bughunt/duckdb/D-01-minmax-nested-subquery/ (not filed yet)"
    affected: "2.0.0, nightly 2.1.0.dev, main d4eea3f208 (nested types: regression from 2ef9f76b2e/5432471e7a); collated VARCHAR also 1.5.x"
    fixed_in: "open (fix prepared: docs/bughunt/duckdb/D-01-minmax-nested-subquery/fix.patch)"
    match:
      outcome: internal_error
      message_regex: "Cannot copy BoundSubqueryExpression"
    poc: pocs/duckdb_D01_minmax_subquery.sql

  - id: duckdb-D02
    title: "outer-join / MERGE condition with two subqueries: INTERNAL Error Failed to bind column reference"
    source: "docs/bughunt/duckdb/D-02-outer-join-two-subqueries/ (not filed yet)"
    affected: "2.0.0, nightly 2.1.0.dev2610310630 (1.5.6: not implemented)"
    fixed_in: "57a6875edf (PR #28246, issue #28156), DuckDB main 2 Nov 2026"
    match:
      outcome: internal_error
      message_regex: "Failed to bind column reference"
  - id: duckdb-27720
    title: "lambda inside an aggregate or window function inside a lambda: BoundReferenceExpression should not be used here yet"

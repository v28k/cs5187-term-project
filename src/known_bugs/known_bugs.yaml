# PostgreSQL bugs our project found and reported (Oct 2026), used for the
# "known-bug reproduction" metric and as rediscovery seeds (corpus/bug_seeds/).
# Every entry has a public pgsql-bugs / pgsql-hackers source and a PoC that
# reproduces on the assertion-enabled base build 26bd08fb (16 Oct 2026):
#   python -m pgfuzz replay configs/rediscover.yaml known_bugs/pocs/<file>.sql --expect-bug
#
# Format (all 'match' fields are optional, but at least one is required, and
# every field given must match the oracle's classification):
#   outcome, sqlstate, message_regex, assert_regex, frame_regex, offline

bugs:
  - id: pgbug-19768
    title: "JSON_TABLE does not assign collations to its context item and PASSING arguments"
    source: "https://www.postgresql.org/message-id/19768-3633daa830be95db@postgresql.org"
    affected: "17, 18, master (26bd08fb)"
    fixed_in: "open (patch sent)"
    match:
      outcome: assertion
      assert_regex: "execExpr\\.c: list_length\\(rcexpr->inputcollids\\) == nopers"
    poc: pocs/pg19768_json_table_collation.sql

  - id: pgbug-19793
    title: "range @> elem folded to true/false for a NULL element (constant empty or unbounded range)"
    source: "pgsql-bugs BUG #19793 (23 Oct 2026)"
    affected: "17, 18, master (26bd08fb, 126976a8)"
    fixed_in: "open (patch sent)"
    match:
      outcome: wrong_result
      message_regex: "check expr:scalar_sub failed"
    poc: pocs/pg19793_range_contains_null.sql

  - id: pgbug-19802
    title: "MERGE into a partitioned table: SubPlan found with no parent plan"
    source: "pgsql-bugs BUG #19802 (28 Oct 2026), confirmed upstream"
    affected: "18, master (26bd08fb)"
    fixed_in: "7a5559a6 (11 Nov 2026), back-patched to 15"
    match:
      outcome: internal_error
      message_regex: "SubPlan found with no parent plan"
    poc: pocs/pg19802_merge_subplan.sql

  - id: pgbug-19803
    title: "Parallel Append: Assert(!parallel_aware || parallel_safe) with a materialized CTE"
    source: "pgsql-bugs BUG #19803 (28 Oct 2026), confirmed upstream"
    affected: "master before abda2a2c (e.g. 26bd08fb)"
    fixed_in: "abda2a2c (master)"
    match:
      outcome: assertion
      assert_regex: "pathnode\\.c: !parallel_aware \\|\\| pathnode->path\\.parallel_safe"
    poc: pocs/pg19803_parallel_append_assert.sql

  - id: pgbug-19771
    title: "to_char() of numeric NaN makes NORMALIZE() fail an assertion"
    source: "pgsql-bugs BUG #19771, fix commit 776df8a6"
    affected: "master before 776df8a6 (e.g. 26bd08fb)"
    fixed_in: "776df8a6 (master)"
    match:
      outcome: assertion
      assert_regex: "varlena\\.c: \\(char \\*\\) p == VARDATA_ANY\\(input\\)"
    poc: pocs/pg19771_to_char_nan_normalize.sql

  - id: audit-f1
    title: "NOT IN -> anti-join conversion ignores a NULL-producing implicit cast on the sub-select side"
    source: "https://www.postgresql.org/message-id/PN0P287MB090375874C6D5433282EC9DFA7642@PN0P287MB0903.INDP287.PROD.OUTLOOK.COM"
    affected: "19rc1, master (26bd08fb); not 18"
    fixed_in: "open (patch sent)"
    match:
      outcome: wrong_result
      message_regex: "check tlp_where failed: 1 rows vs 2 rows"
    poc: pocs/audit_f1_not_in_cast.sql

  - id: audit-f2
    title: "first_value()/nth_value() IGNORE NULLS over a frame excluding all peers never returns"
    source: "https://www.postgresql.org/message-id/PN0P287MB09038F3BD9921EBACF5646F6A7632@PN0P287MB0903.INDP287.PROD.OUTLOOK.COM"
    affected: "19, master (26bd08fb)"
    fixed_in: "open (developer replied 24 Oct 2026)"
    match:
      outcome: hang
    poc: pocs/audit_f2_ignore_nulls_hang.sql

  - id: c-01
    title: "dependencies_clauselist_selectivity() assertion with two clauses on one statistics expression"
    source: "https://postgr.es/m/PN0P287MB0903563C70D8E5B81912E855A7602@PN0P287MB0903.INDP287.PROD.OUTLOOK.COM"
    affected: "14 - master before b0392c26 (e.g. 26bd08fb)"
    fixed_in: "b0392c26 (master, backpatched to 14; author: team member)"
    match:
      outcome: assertion
      assert_regex: "dependencies\\.c: AttrNumberIsForUserDefinedAttr\\(list_attnums\\[i\\]\\)"
    poc: pocs/c01_dependencies_duplicate_expr.sql

  - id: esi-nonfinite
    title: "pg_restore_extended_stats() accepts non-finite MCV frequencies (absurd row estimates)"
    source: "pgsql-hackers patch: Reject non-finite MCV frequencies in pg_restore_extended_stats()"
    affected: "master (26bd08fb)"
    fixed_in: "open (patch submitted)"
    match:
      outcome: performance
      message_regex: "-> 1e\\+100"
    poc: pocs/mcv_nonfinite_freqs.sql

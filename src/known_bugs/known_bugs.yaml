# PostgreSQL bugs our project found and reported (Oct 2026), used for the
# "known-bug reproduction" metric and as rediscovery seeds (corpus/bug_seeds/).
# Every entry has a public pgsql-bugs / pgsql-hackers source and a PoC that
# reproduces on the assertion-enabled base build 26bd08fb (16 Oct 2026):
#   python -m pgfuzz replay configs/rediscover.yaml known_bugs/pocs/<file>.sql --expect-bug
#
# Format (all 'match' fields are optional, but at least one is required, and
# every field given must match the oracle's classification):
#   outcome, sqlstate, message_regex, assert_regex, frame_regex, offline

bugs:
  - id: pgbug-19768
    title: "JSON_TABLE does not assign collations to its context item and PASSING arguments"
    source: "https://www.postgresql.org/message-id/19768-3633daa830be95db@postgresql.org"
    affected: "17, 18, master (26bd08fb)"
    fixed_in: "open (patch sent)"
    match:
      outcome: assertion
      assert_regex: "execExpr\\.c: list_length\\(rcexpr->inputcollids\\) == nopers"
    poc: pocs/pg19768_json_table_collation.sql

  - id: pgbug-19793
    title: "range @> elem folded to true/false for a NULL element (constant empty or unbounded range)"
    source: "pgsql-bugs BUG #19793 (23 Oct 2026)"
    affected: "17, 18, master (26bd08fb, 126976a8)"
    fixed_in: "open (patch sent)"
    match:
      outcome: wrong_result
      message_regex: "check expr:scalar_sub failed"
    poc: pocs/pg19793_range_contains_null.sql

  - id: pgbug-19802
    title: "MERGE into a partitioned table: SubPlan found with no parent plan"
    source: "pgsql-bugs BUG #19802 (28 Oct 2026), confirmed upstream"
    affected: "18, master (26bd08fb)"
    fixed_in: "open (fix posted upstream)"
    match:
      outcome: internal_error
      message_regex: "SubPlan found with no parent plan"
    poc: pocs/pg19802_merge_subplan.sql

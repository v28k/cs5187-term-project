# RQ2: rule coverage with/without rule feedback and targeting (sqlite)
# generated by scripts/eval/make_configs.py; do not edit
budget:
  seconds: 3600
configs:
- name: no_rule_feedback
  label: no_rule_feedback
  generator:
    params:
      bandit: 0.1
      dialect_data: '{config_dir}/../../grammar/overlays/sqlite.data.yaml'
      grammar: '{config_dir}/../../grammar/postgres.pgg'
      mm_prob: 0.5
      overlays:
      - '{config_dir}/../../grammar/overlays/sqlite.pgg'
      plan_guidance: false
      schema: '{config_dir}/../../corpus/sqlite/schema.yaml'
      rule_guidance: false
      rule_target: false
    plugin: pgfuzz.grammar.generator:GrammarGenerator
- name: rule_feedback
  label: rule_feedback
  generator:
    params:
      bandit: 0.1
      dialect_data: '{config_dir}/../../grammar/overlays/sqlite.data.yaml'
      grammar: '{config_dir}/../../grammar/postgres.pgg'
      mm_prob: 0.5
      overlays:
      - '{config_dir}/../../grammar/overlays/sqlite.pgg'
      plan_guidance: false
      schema: '{config_dir}/../../corpus/sqlite/schema.yaml'
      rule_guidance: true
      rule_target: false
    plugin: pgfuzz.grammar.generator:GrammarGenerator
- name: rule_targeting
  label: rule_targeting
  generator:
    params:
      bandit: 0.1
      dialect_data: '{config_dir}/../../grammar/overlays/sqlite.data.yaml'
      grammar: '{config_dir}/../../grammar/postgres.pgg'
      mm_prob: 0.5
      overlays:
      - '{config_dir}/../../grammar/overlays/sqlite.pgg'
      plan_guidance: false
      schema: '{config_dir}/../../corpus/sqlite/schema.yaml'
      rule_guidance: true
      rule_target: true
    plugin: pgfuzz.grammar.generator:GrammarGenerator
coverage_interval_s: 100000
executor:
  params:
    differential:
      per_query: 2
    metamorphic: true
    rule_feedback:
      overhead: 0.25
      prob: 0.3
    setup_sql: '{config_dir}/../../corpus/sqlite/schema.sql'
    statement_timeout_ms: 3000
  plugin: pgfuzz.targets.sqlite_executor:SQLiteExecutor
experiment: e4_rules_sqlite
known_bugs: ../../known_bugs/sqlite.yaml
log_sql: failures
max_harness_errors: 50
max_repros: 3
output_dir: ../../results
seed: 8100
snapshot_interval_s: 30
trials: 4

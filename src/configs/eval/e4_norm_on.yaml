# RQ4: DuckDB vs SQLite with learned normalizers
# generated by scripts/eval/make_configs.py; do not edit
budget:
  seconds: 3600
configs:
- generator:
    params:
      bandit: 0.1
      dialect_data: '{config_dir}/../../grammar/overlays/sqlite.data.yaml'
      grammar: '{config_dir}/../../grammar/postgres.pgg'
      max_depth: 7
      mm_prob: 0.5
      overlays:
      - '{config_dir}/../../grammar/overlays/sqlite.pgg'
      - '{config_dir}/../../grammar/overlays/turso.pgg'
      plan_guidance: false
      schema: '{config_dir}/../../corpus/sqlite/schema.yaml'
      soft_depth: 4
    plugin: pgfuzz.grammar.generator:GrammarGenerator
  label: Grammar+Oracles+vsSQLite(learned)
  name: grammar_xengine
coverage_interval_s: 100000
executor:
  params:
    learned: '{config_dir}/../../normalizers/duckdb__sqlite.yaml'
    reference:
      plugin: pgfuzz.targets.sqlite_executor:SQLiteExecutor
      rules: false
    test:
      metamorphic: true
      plugin: pgfuzz.targets.duckdb_executor:DuckDBExecutor
      setup_sql: '{config_dir}/../../corpus/common/schema.sql'
      statement_timeout_ms: 3000
  plugin: pgfuzz.reference.xversion_executor:CrossVersionExecutor
experiment: e4_norm_on
known_bugs: ../../known_bugs/duckdb.yaml
log_sql: failures
max_harness_errors: 50
max_repros: 3
output_dir: ../../results
seed: 8400
snapshot_interval_s: 30
trials: 4

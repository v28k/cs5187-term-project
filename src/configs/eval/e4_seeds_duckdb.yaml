# RQ5: engine test suites as seeds (duckdb); first run `pgfuzz import-tests <suite> --out corpus/suites/duckdb`
# generated by scripts/eval/make_configs.py; do not edit
budget:
  seconds: 3600
configs:
- name: no_seeds
  label: no_seeds
  generator:
    params:
      bandit: 0.1
      dialect_data: '{config_dir}/../../grammar/overlays/duckdb.data.yaml'
      grammar: '{config_dir}/../../grammar/postgres.pgg'
      mm_prob: 0.5
      overlays:
      - '{config_dir}/../../grammar/overlays/duckdb.pgg'
      plan_guidance: false
      schema: '{config_dir}/../../corpus/duckdb/schema.yaml'
      seeds: null
    plugin: pgfuzz.grammar.generator:GrammarGenerator
- name: suite_seeds
  label: suite_seeds
  generator:
    params:
      bandit: 0.1
      dialect_data: '{config_dir}/../../grammar/overlays/duckdb.data.yaml'
      grammar: '{config_dir}/../../grammar/postgres.pgg'
      mm_prob: 0.5
      overlays:
      - '{config_dir}/../../grammar/overlays/duckdb.pgg'
      plan_guidance: false
      schema: '{config_dir}/../../corpus/duckdb/schema.yaml'
      seeds: '{config_dir}/../../corpus/suites/duckdb'
      seed_prob: 0.1
    plugin: pgfuzz.grammar.generator:GrammarGenerator
coverage_interval_s: 100000
executor:
  params:
    differential:
      per_query: 2
    metamorphic: true
    rule_feedback:
      overhead: 0.25
      prob: 0.3
    setup_sql: '{config_dir}/../../corpus/duckdb/schema.sql'
    statement_timeout_ms: 3000
    threads: 2
  plugin: pgfuzz.targets.duckdb_executor:DuckDBExecutor
experiment: e4_seeds_duckdb
known_bugs: ../../known_bugs/duckdb.yaml
log_sql: failures
max_harness_errors: 50
max_repros: 3
output_dir: ../../results
seed: 8300
snapshot_interval_s: 30
trials: 4
